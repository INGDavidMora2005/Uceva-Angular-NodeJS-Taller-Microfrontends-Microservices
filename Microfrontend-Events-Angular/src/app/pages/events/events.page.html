@switch(state) {
  @case ('loading') {
    <app-alert alertState="loading" text="Cargando eventos..."></app-alert>
  }
  @case ('error') {
    <app-alert alertState="error" text="Error al cargar los eventos"></app-alert>
  }
  @case ('success') {
    <app-events-table [events]="events"></app-events-table>
  }
}
